# Speech aug: ffmpeg encode→decode round-trip (MP3 / Opus / AAC / GSM-FR).
data:
  atadd_t1_train_audio: /root/autodl-fs/track1/train
  atadd_t1_train_label: /root/autodl-fs/track1/label/train.csv
  atadd_t1_dev_audio: /root/autodl-fs/track1/dev
  atadd_t1_dev_label: /root/autodl-fs/track1/label/dev.csv
  atadd_t1_eval_audio: /root/autodl-fs/track1/eval
ssl:
  xlsr: /root/autodl-fs/models/wav2vec2-xls-r-300m

  # last | cat_linear | cat_proj_v1 | cat_proj_v2 | mean | weight_sum | mhfa_fuse | mhfa_pool
  # XLSR multi-layer readout (ignored by non-XLSR frontends):
  xlsr_selected_layers: [3, 11, 24]
  xlsr_layer_fusion: cat_proj_v1


filter_types: speech
train_task: atadd-track1
out_fold: /root/autodl-fs/ckpt_t1/train_dev_threshold0.8
model: ft-w2v2aasist              # ft-w2v2aasist   ft-wavlmaasist   ft-beatsaasist
save_best_by: loss
assist_project_choice: 0

aug:
  aug_speech: 0.2
  speech_aug_method: rawboost
  speech_rawboost_algo: 5

num_epochs:  100
batch_size:  24
lr:          0.000001
lr_decay:    0.5
interval:    2
num_workers: 4

eval_steps:        1000
full_eval_steps:   6000
eval_warmup_steps: 6000
patience:          20
